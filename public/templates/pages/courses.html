<div class="container">
    <div class="courses-header">
        <div class="courses-header-left">
            <button id="back-to-categories-btn" class="btn-back" style="display: none;">
                ← Retour aux catégories
            </button>
            <h2 id="courses-title">Mes Cours</h2>
        </div>
        <button id="add-course-btn" class="btn-primary">+ Ajouter un cours</button>
    </div>

    <!-- Category Grid (initial view) -->
    <div id="category-grid" class="category-grid">
        <!-- Categories will be generated dynamically -->
    </div>

    <!-- Course Controls (hidden until category selected) -->
    <div id="course-controls" class="course-controls" style="display: none;">
        <input type="text" id="course-search" placeholder="Rechercher un cours..." class="search-input">
        <select id="course-type-filter" class="filter-select">
            <option value="">Tous les types</option>
            <option value="cours">Cours</option>
            <option value="exercice">Exercices</option>
            <option value="video">Vidéos</option>
        </select>
        <select id="course-filter" class="filter-select">
            <option value="">Tous les sujets</option>
        </select>
    </div>

    <!-- Course Grid (hidden until category selected) -->
    <div class="course-grid" id="course-grid" style="display: none;">
        <!-- Les cours seront générés dynamiquement -->
    </div>
</div>
