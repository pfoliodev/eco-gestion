<div class="container">
    <h2>Événements</h2>
    <div class="stats">
        <div class="stat-card" id="card-courses" style="cursor: pointer;">
            <h3 id="stat-courses">0</h3>
            <p>Cours disponibles</p>
        </div>
        <div class="stat-card" id="card-exercises" style="cursor: pointer;">
            <h3 id="stat-exercises">0</h3>
            <p>Exercices disponibles</p>
        </div>
    </div>

    <!-- QCM Feature Card -->
    <div class="feature-card" id="feature-card-quiz">
        <div class="feature-card-content">
            <div class="feature-badge orange">📝 Inédit</div>
            <h3>Révisez avec les QCM</h3>
            <p>Testez vos connaissances chapitre par chapitre et suivez votre progression en temps réel.</p>
            <small style="color: var(--text-secondary); font-size: 0.85rem;">🔒 Connexion requise pour accéder aux
                QCM</small>
            <div id="qcm-card-button" style="margin-top: 1rem;"></div>
        </div>
        <div class="feature-icon">✅</div>
    </div>

    <!-- Reminders Section -->
    <div class="reminders-section" style="margin-top: 3rem; display: none;">
        <h3 style="margin-bottom: 1.5rem; color: var(--text-main);">⏰ Prochaines Évaluations</h3>
        <div id="reminders-list" class="reminders-list">
            <!-- Reminders will be loaded here -->
        </div>
    </div>

    <!-- Recent Courses Section -->
    <div class="recent-courses-section" style="margin-top: 3rem;">
        <h3 style="margin-bottom: 1.5rem; color: var(--text-main);">📚 Derniers cours ajoutés</h3>
        <div id="recent-courses-list" class="recent-courses-list">
            <!-- Recent courses will be loaded here -->
        </div>
    </div>
</div>
