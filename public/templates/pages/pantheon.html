<div class="pantheon-container">
    <div class="pantheon-header">
        <div class="pantheon-logo-container">
            <!-- Logo will be set via CSS or JS to use the uploaded image -->
            <img src="/images/pantheon_logo.png" alt="Panthéon Logo" class="pantheon-logo"
                onerror="this.style.display='none'">
        </div>
        <h1 class="pantheon-title">LE PANTHÉON DU SAVOIR</h1>
        <p class="pantheon-subtitle">(Top Collectionneurs de Badges)</p>
    </div>

    <div class="leaderboard-card">
        <div class="leaderboard-header">
            <div class="col-rank">Rang</div>
            <div class="col-user">Utilisateur</div>
            <div class="col-badges">Badges</div>
            <div class="col-progress">Progression</div>
        </div>

        <div id="leaderboard-list" class="leaderboard-list">
            <!-- Loading State -->
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Chargement du classement...</p>
            </div>
        </div>
    </div>
</div>
