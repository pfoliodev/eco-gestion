<div class="container shop-container">
    <div class="shop-header">
        <h2>🪙 Boutique IFH</h2>
        <p class="shop-subtitle">Dépensez vos IFH Coins et personnalisez votre expérience</p>

        <div class="shop-balance-display">
            <span class="balance-label">Votre solde</span>
            <div class="balance-value">
                <span class="coin-icon">🪙</span>
                <span class="coin-amount" id="shop-balance">0</span>
                <span class="balance-suffix">IFH</span>
            </div>
        </div>
    </div>

    <!-- Category Filters -->
    <div class="shop-filters">
        <button class="shop-filter-btn active" data-category="all">
            <span class="filter-icon">🏪</span>
            <span class="filter-label">Tout</span>
        </button>
        <button class="shop-filter-btn" data-category="theme">
            <span class="filter-icon">🎨</span>
            <span class="filter-label">Thèmes</span>
        </button>
        <button class="shop-filter-btn" data-category="frame">
            <span class="filter-icon">🖼️</span>
            <span class="filter-label">Cadres</span>
        </button>
        <button class="shop-filter-btn" data-category="badge">
            <span class="filter-icon">🏅</span>
            <span class="filter-label">Badges</span>
        </button>
        <button class="shop-filter-btn" data-category="boost">
            <span class="filter-icon">⚡</span>
            <span class="filter-label">Boosts</span>
        </button>
    </div>

    <!-- Limited Items Section -->
    <section class="shop-section limited-section" id="limited-section" style="display: none;">
        <h3 class="section-title">
            <span class="section-icon">⏳</span>
            Éditions Limitées
        </h3>
        <div class="shop-grid" id="limited-items-grid">
            <!-- Limited items will be loaded here -->
        </div>
    </section>

    <!-- All Items Section -->
    <section class="shop-section">
        <h3 class="section-title">
            <span class="section-icon">🛍️</span>
            Articles Disponibles
        </h3>
        <div class="shop-grid" id="shop-items-grid">
            <!-- Items will be loaded here -->
            <div class="loading-spinner">Chargement de la boutique...</div>
        </div>
    </section>

    <!-- Empty State -->
    <div class="shop-empty" id="shop-empty" style="display: none;">
        <div class="empty-icon">🛒</div>
        <h3>Aucun article disponible</h3>
        <p>Revenez bientôt pour découvrir nos nouveautés !</p>
    </div>
</div>

<!-- Purchase Confirmation Modal -->
<div class="modal" id="purchase-modal" style="display: none;">
    <div class="modal-content" style="max-width: 400px; position: relative;">
        <button class="modal-close" id="purchase-modal-close"
            style="position: absolute; top: 1rem; right: 1rem; width: 32px; height: 32px; border: none; background: #f1f5f9; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.25rem; color: #64748b; transition: all 0.2s ease;">&times;</button>
        <h3 style="margin-bottom: 1.5rem;">Confirmer l'achat</h3>

        <div class="purchase-item-preview" id="purchase-preview"
            style="text-align: center; padding: 1.5rem; background: #f8fafc; border-radius: 0.75rem; margin-bottom: 1.5rem;">
            <!-- Item preview will be inserted here -->
        </div>

        <div class="purchase-summary"
            style="display: flex; flex-direction: column; gap: 0.75rem; margin-bottom: 1.5rem;">
            <div class="purchase-price"
                style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #f8fafc; border-radius: 0.5rem;">
                <span class="label" style="color: var(--text-secondary);">Prix</span>
                <span class="value"
                    style="display: flex; align-items: center; gap: 0.35rem; font-size: 1.1rem; font-weight: 700; color: #d4af37;">
                    <span class="coin-icon">🪙</span>
                    <span id="purchase-price">0</span>
                </span>
            </div>
            <div class="purchase-after"
                style="display: flex; justify-content: space-between; align-items: center; padding: 0.75rem 1rem; background: #f8fafc; border-radius: 0.5rem;">
                <span class="label" style="color: var(--text-secondary);">Solde après achat</span>
                <span class="value" id="purchase-after-balance" style="font-weight: 600;">0 IFH</span>
            </div>
        </div>

        <div class="form-actions" style="display: flex; gap: 1rem;">
            <button class="btn-primary" id="purchase-confirm" style="flex: 1;">
                <span class="coin-icon">🪙</span>
                Acheter
            </button>
            <button class="btn-cancel" id="purchase-cancel">Annuler</button>
        </div>
    </div>
</div>
