<section id="mon-compte" class="page">
    <div class="container" style="max-width: 1000px;">
        <div class="account-header">
            <div class="avatar-container">
                <img id="account-avatar" src="https://ui-avatars.com/api/?name=User&background=6366f1&color=fff"
                    alt="Avatar">
            </div>
            <div class="user-info-header">
                <h2 id="user-display-name">Mon Compte</h2>
                <p id="user-display-email" style="color: var(--text-secondary); margin-top: 0.25rem;"></p>
            </div>
            <div class="role-badge-container">
                <span class="user-badge" id="user-role-badge">Utilisateur</span>
            </div>
        </div>

        <div class="account-grid">
            <!-- LEFT: Settings -->
            <div class="account-section">
                <h3 style="margin-bottom: 1.5rem;">⚙️ Paramètres du Profil</h3>
                <form id="profile-form">
                    <div class="form-group">
                        <label for="profile-firstname">Prénom</label>
                        <input type="text" id="profile-firstname" placeholder="Ex: Jean">
                    </div>
                    <div class="form-group">
                        <label for="profile-lastname">Nom</label>
                        <input type="text" id="profile-lastname" placeholder="Ex: Dupont">
                    </div>
                    <div class="form-group">
                        <label for="profile-pic-url">Photo de profil (URL)</label>
                        <input type="url" id="profile-pic-url" placeholder="https://exemple.com/image.jpg">
                        <p style="font-size: 0.75rem; color: var(--text-secondary); margin-top: 0.25rem;">Collez
                            le lien d'une image (ex: Google Images)</p>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; margin-top: 1rem;">Enregistrer
                        les modifications</button>
                </form>
            </div>

            <!-- Favorites Section -->
            <div class="account-section" style="grid-column: 1 / -1;">
                <h3 style="margin-bottom: 1.5rem;">⭐ Mes Cours Favoris</h3>
                <div id="favorites-list" class="favorites-grid">
                    <div style="text-align: center; padding: 2rem;">Chargement...</div>
                </div>
            </div>

            <!-- RIGHT: Bug reports -->
            <div class="account-section">
                <h3 style="margin-bottom: 1.5rem;">🐞 Mes Signalements</h3>
                <div class="users-table-container">
                    <table class="users-table">
                        <thead>
                            <tr>
                                <th>Sujet</th>
                                <th>Date</th>
                                <th>Statut</th>
                            </tr>
                        </thead>
                        <tbody id="user-bugs-table-body">
                            <tr>
                                <td colspan="3" style="text-align: center; padding: 2rem;">Chargement...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</section>
