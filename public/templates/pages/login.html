<div class="container" style="max-width: 500px;">
    <h2>Connexion</h2>
    <form id="login-form">
        <div class="form-group">
            <label for="login-email">Email</label>
            <input type="email" id="login-email" required>
        </div>
        <div class="form-group">
            <label for="login-password">Mot de passe</label>
            <input type="password" id="login-password" required>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn-primary">Se connecter</button>
            <button type="button" id="google-login-btn" class="btn-google"
                style="margin-top: 10px; background-color: #4285F4; color: white;">
                Se connecter avec Google
            </button>
        </div>
    </form>
    <div
        style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
        <p style="color: var(--text-secondary);">
            Vous n'avez pas de compte ?
            <a href="#register" style="color: var(--primary-color); text-decoration: none; font-weight: 500;">
                Créer un compte
            </a>
        </p>
    </div>
</div>
