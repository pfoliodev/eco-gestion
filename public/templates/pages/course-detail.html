<div class="container">
    <div class="course-detail-header">
        <button id="back-to-courses-btn" class="btn-back">← Retour aux cours</button>
        <div class="course-header-actions">
            <button id="download-pdf-btn" class="btn-download-pdf" title="Télécharger en PDF">
                📄 Télécharger PDF
            </button>
            <div id="admin-actions" class="course-actions" style="display: none;">
                <button id="edit-course-btn" class="btn-edit">✏️ Modifier</button>
                <button id="delete-course-btn" class="btn-delete">🗑️ Supprimer</button>
            </div>
        </div>
    </div>
    <div class="course-detail-layout">
        <aside class="course-sidebar-left">
            <section class="sidebar-section">
                <h3>Cours du même sujet</h3>
                <div id="related-courses-list">
                    <!-- Related courses will be loaded here -->
                </div>
            </section>
            <section id="exercises-sidebar-section" class="sidebar-section">
                <h3>Exercices liés</h3>
                <div id="related-exercises-list">
                    <!-- Related exercises will be loaded here -->
                </div>
            </section>
            <section id="flashcards-sidebar-section" class="sidebar-section">
                <h3>📚 Flashcards</h3>
                <div id="course-flashcards-info">
                    <p class="fc-count-info"><span id="course-fc-count">0</span> flashcards</p>
                    <button class="btn-primary btn-small" id="study-course-flashcards" style="display: none;">
                        🎯 Réviser
                    </button>
                    <button class="btn-edit btn-small" id="manage-course-flashcards" style="display: none;">
                        ✏️ Gérer
                    </button>
                </div>
            </section>
            <section id="course-viewers-section" class="sidebar-section" style="display: none;">
                <h3 class="viewers-count">👁️ Vu par 0 étudiant</h3>
                <div id="viewers-list-container">
                    <!-- Viewers will be loaded dynamically -->
                </div>
            </section>
        </aside>
        <main class="course-content-main">
            <div id="course-content" class="course-detail-content"></div>
        </main>
    </div>
</div>
