<!DOCTYPE html>
<html lang="fr">

<head>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.css">
    <link rel="stylesheet" href="css/components/pet-selection.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.2/tinymce.min.js" referrerpolicy="origin"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<body>
    <!-- Header loaded dynamically -->
    <div id="header-container"></div>

    <!-- Main content -->

        <div id="page-accueil" class="page"></div>

        <div id="page-course-detail" class="page"></div>

        <div id="page-privacy-policy" class="page"></div>
        <div id="page-legal-notice" class="page"></div>
        <div id="page-shop" class="page"></div>

    <!-- Cookie Banner loaded dynamically -->
    <div id="cookie-banner-container"></div>

    <div id="modals-container"></div>

    <button id="bug-fab" class="fab" title="Signaler un bug">🐞</button>

    <script src="https://cdn.jsdelivr.net/npm/notyf@3/notyf.min.js"></script>
    <script type="module" src="js/main.js"></script>
